<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reviewers Tool Box</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    --bg: #eef1f5;
    --panel: #ffffff;
    --ink: #15233b;
    --muted: #5b6a82;
    --line: #d5dce6;
    --accent: #0d6b57;
    --accent-ink: #ffffff;
    --accent-soft: #dff1ec;
    --focus: #1f5fd1;
    --font: "Schibsted Grotesk", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #101722;
      --panel: #19222f;
      --ink: #e8edf5;
      --muted: #9aa8bd;
      --line: #2b3748;
      --accent: #4fc3a6;
      --accent-ink: #08201a;
      --accent-soft: #17332d;
      --focus: #7aa7ff;
    }
  }
  :root[data-theme="dark"] {
    --bg: #101722;
    --panel: #19222f;
    --ink: #e8edf5;
    --muted: #9aa8bd;
    --line: #2b3748;
    --accent: #4fc3a6;
    --accent-ink: #08201a;
    --accent-soft: #17332d;
    --focus: #7aa7ff;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  *, *::before, *::after { box-sizing: inherit; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font);
    font-size: 16px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; }
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 6px; }

  .shell { max-width: 1040px; margin: 0 auto; padding: 28px 20px 56px; }

  header { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 16px; margin-bottom: 22px; }
  h1 { font-size: clamp(2rem, 5vw, 3rem); line-height: 1.05; font-weight: 800; letter-spacing: -0.03em; margin: 0; }
  .sub { color: var(--muted); margin: 6px 0 0; max-width: 46ch; }

  .search { position: relative; flex: 1 1 280px; max-width: 380px; }
  .search input {
    width: 100%; font: inherit; color: var(--ink);
    background: var(--panel); border: 2px solid var(--line); border-radius: 10px;
    padding: 12px 44px 12px 14px;
  }
  .search input::placeholder { color: var(--muted); }
  .search input:focus { border-color: var(--accent); outline: none; }
  .search kbd {
    position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
    font: 500 0.8rem var(--font); color: var(--muted);
    border: 1px solid var(--line); border-radius: 5px; padding: 1px 7px; background: var(--bg);
  }

  .filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 22px; }
  .chip {
    font: 500 0.95rem var(--font); color: var(--ink); cursor: pointer;
    background: var(--panel); border: 2px solid var(--line); border-radius: 999px; padding: 6px 14px;
  }
  .chip:hover { border-color: var(--accent); }
  .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .chip .n { opacity: 0.7; margin-left: 6px; font-weight: 400; }

  .group { margin-bottom: 30px; }
  .group h2 { font-size: 1.15rem; font-weight: 700; margin: 0 0 10px; display: flex; align-items: baseline; gap: 10px; }
  .group h2 span { color: var(--muted); font-weight: 400; font-size: 0.95rem; }

  .list { background: var(--panel); border: 2px solid var(--line); border-radius: 14px; overflow: hidden; }
  .row {
    display: grid; grid-template-columns: 44px 1fr auto; align-items: center; gap: 14px;
    padding: 14px 16px; text-decoration: none; border-top: 1px solid var(--line);
  }
  .row:first-child { border-top: 0; }
  .row:hover { background: var(--accent-soft); }
  .mark {
    width: 44px; height: 44px; border-radius: 10px; display: grid; place-items: center;
    background: var(--accent); color: var(--accent-ink); font-weight: 800; font-size: 1.05rem; letter-spacing: -0.02em;
  }
  .title { font-weight: 700; font-size: 1.05rem; line-height: 1.25; }
  .desc { color: var(--muted); font-size: 0.93rem; margin-top: 2px; max-width: 70ch; }
  .host { color: var(--muted); font-size: 0.82rem; margin-top: 2px; }
  .open { font-weight: 700; font-size: 0.9rem; color: var(--accent); white-space: nowrap; }
  .row:hover .open { text-decoration: underline; }

  .empty { text-align: center; color: var(--muted); padding: 40px 12px; border: 2px dashed var(--line); border-radius: 14px; }

  footer { margin-top: 36px; color: var(--muted); font-size: 0.9rem; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 10px; }
  .theme { font: inherit; color: var(--muted); background: none; border: 1px solid var(--line); border-radius: 8px; padding: 4px 12px; cursor: pointer; }

  @media (max-width: 560px) {
    .row { grid-template-columns: 40px 1fr; }
    .open { display: none; }
    .mark { width: 40px; height: 40px; }
  }
  @media (prefers-reduced-motion: no-preference) {
    .row, .chip { transition: background-color 0.12s, border-color 0.12s; }
  }
</style>
</head>
<body>
<div class="shell">
  <header>
    <div>
      <h1>Reviewers Tool Box</h1>
      <p class="sub">Every outside tool and link the team uses for tax prep and review, in one place.</p>
    </div>
    <div class="search">
      <input id="q" type="search" placeholder="Search tools" aria-label="Search tools" autocomplete="off">
      <kbd aria-hidden="true">/</kbd>
    </div>
  </header>

  <nav class="filters" id="filters" aria-label="Filter by category"></nav>
  <main id="out"></main>

  <footer>
    <span id="count"></span>
    <button class="theme" id="theme" type="button">Switch theme</button>
  </footer>
</div>

<script>
/* ------------------------------------------------------------------
   TO ADD A LINK: copy one line below, change the text, keep the commas.
   category: any name. Links with the same category are grouped together.
------------------------------------------------------------------- */
const LINKS = [
  {
    title: "California DMV Vehicle License Fee Calculator",
    desc: "Estimate the VLF and registration fees for a California vehicle.",
    category: "Vehicles & DMV",
    url: "https://www.dmv.ca.gov/wasapp/FeeCalculatorWeb/vlfForm.do?csrt=14926755158816426428"
  },
  {
    title: "Form 1095 Decoder",
    desc: "Decode the codes on Form 1095-A, B and C.",
    category: "Forms & Decoders",
    url: "https://www.mytaxform.com/form-1095-decoder/"
  },
  {
    title: "FTB Tax Calculator, Tables and Rates",
    desc: "California Franchise Tax Board personal income tax calculator, tax tables and rates.",
    category: "California Tax (FTB)",
    url: "https://www.ftb.ca.gov/file/personal/tax-calculator-tables-rates.asp"
  },
  {
    title: "Treasury Currency Exchange Rates Converter",
    desc: "Official Treasury exchange rates for converting foreign currency amounts.",
    category: "Currency",
    url: "https://fiscaldata.treasury.gov/currency-exchange-rates-converter/"
  }
];

const $ = (id) => document.getElementById(id);
let activeCat = "All";

function hostOf(url) { try { return new URL(url).hostname.replace(/^www\./, ""); } catch (e) { return url; } }
function initials(t) {
  const w = t.replace(/[^A-Za-z0-9 ]/g, "").split(" ").filter(Boolean);
  return ((w[0] || "?")[0] + ((w[1] || "")[0] || "")).toUpperCase();
}
function esc(s) { return String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

function renderFilters() {
  const cats = ["All", ...Array.from(new Set(LINKS.map((l) => l.category)))];
  $("filters").innerHTML = cats.map((c) => {
    const n = c === "All" ? LINKS.length : LINKS.filter((l) => l.category === c).length;
    return `<button class="chip" type="button" data-cat="${esc(c)}" aria-pressed="${c === activeCat}">${esc(c)}<span class="n">${n}</span></button>`;
  }).join("");
}

function render() {
  const q = $("q").value.trim().toLowerCase();
  const shown = LINKS.filter((l) =>
    (activeCat === "All" || l.category === activeCat) &&
    (!q || (l.title + " " + (l.desc || "") + " " + l.category + " " + hostOf(l.url)).toLowerCase().includes(q))
  );
  const groups = {};
  shown.forEach((l) => (groups[l.category] = groups[l.category] || []).push(l));

  $("out").innerHTML = shown.length
    ? Object.keys(groups).map((cat) => `
        <section class="group">
          <h2>${esc(cat)} <span>${groups[cat].length} ${groups[cat].length === 1 ? "tool" : "tools"}</span></h2>
          <div class="list">
            ${groups[cat].map((l) => `
              <a class="row" href="${esc(l.url)}" target="_blank" rel="noopener noreferrer">
                <div class="mark" aria-hidden="true">${esc(initials(l.title))}</div>
                <div>
                  <div class="title">${esc(l.title)}</div>
                  ${l.desc ? `<div class="desc">${esc(l.desc)}</div>` : ""}
                  <div class="host">${esc(hostOf(l.url))}</div>
                </div>
                <div class="open">Open tool</div>
              </a>`).join("")}
          </div>
        </section>`).join("")
    : `<div class="empty">No tools match "${esc($("q").value)}". Try a shorter word or pick All.</div>`;

  $("count").textContent = `${shown.length} of ${LINKS.length} tools shown`;
}

$("filters").addEventListener("click", (e) => {
  const b = e.target.closest(".chip");
  if (!b) return;
  activeCat = b.dataset.cat;
  renderFilters();
  render();
});
$("q").addEventListener("input", render);
document.addEventListener("keydown", (e) => {
  if (e.key === "/" && document.activeElement !== $("q")) { e.preventDefault(); $("q").focus(); }
  if (e.key === "Escape" && document.activeElement === $("q")) { $("q").value = ""; render(); $("q").blur(); }
});

$("theme").addEventListener("click", () => {
  const root = document.documentElement;
  const dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  root.dataset.theme = dark ? "light" : "dark";
  try { localStorage.setItem("rtb-theme", root.dataset.theme); } catch (e) {}
});
try { const t = localStorage.getItem("rtb-theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}

renderFilters();
render();
</script>
</body>
</html>
