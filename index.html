<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reviewers Tool Box</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    --bg: #eef1f5;
    --panel: #ffffff;
    --ink: #15233b;
    --muted: #5b6a82;
    --line: #d5dce6;
    --accent: #0d6b57;
    --accent-ink: #ffffff;
    --accent-soft: #dff1ec;
    --focus: #1f5fd1;
    --font: "Schibsted Grotesk", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #101722; --panel: #19222f; --ink: #e8edf5; --muted: #9aa8bd; --line: #2b3748;
      --accent: #4fc3a6; --accent-ink: #08201a; --accent-soft: #17332d; --focus: #7aa7ff;
    }
  }
  :root[data-theme="dark"] {
    --bg: #101722; --panel: #19222f; --ink: #e8edf5; --muted: #9aa8bd; --line: #2b3748;
    --accent: #4fc3a6; --accent-ink: #08201a; --accent-soft: #17332d; --focus: #7aa7ff;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  *, *::before, *::after { box-sizing: inherit; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 16px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
  a { color: inherit; }
  button { font-family: inherit; }
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 6px; }

  .shell { max-width: 1040px; margin: 0 auto; padding: 28px 20px 56px; }

  header { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 16px; margin-bottom: 22px; }
  h1 { font-size: clamp(2rem, 5vw, 3rem); line-height: 1.05; font-weight: 800; letter-spacing: -0.03em; margin: 0; }
  .sub { color: var(--muted); margin: 6px 0 0; max-width: 46ch; }

  .search { position: relative; flex: 1 1 280px; max-width: 380px; }
  .search input { width: 100%; font: inherit; color: var(--ink); background: var(--panel); border: 2px solid var(--line); border-radius: 10px; padding: 12px 44px 12px 14px; }
  .search input::placeholder { color: var(--muted); }
  .search input:focus { border-color: var(--accent); outline: none; }
  .search kbd { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); font: 500 0.8rem var(--font); color: var(--muted); border: 1px solid var(--line); border-radius: 5px; padding: 1px 7px; background: var(--bg); }

  .filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 22px; }
  .chip { font: 500 0.95rem var(--font); color: var(--ink); cursor: pointer; background: var(--panel); border: 2px solid var(--line); border-radius: 999px; padding: 6px 14px; }
  .chip:hover { border-color: var(--accent); }
  .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .chip .n { opacity: 0.7; margin-left: 6px; font-weight: 400; }

  .card { background: var(--panel); border: 2px solid var(--line); border-radius: 16px; overflow: hidden; }
  .card-head { display: flex; align-items: center; gap: 14px; padding: 18px 18px 16px; }
  .mark { flex: none; width: 46px; height: 46px; border-radius: 12px; display: grid; place-items: center; background: var(--accent); color: var(--accent-ink); }
  .mark svg { width: 24px; height: 24px; }
  .card-head .grow { flex: 1; min-width: 0; }
  .title { font-weight: 800; font-size: 1.2rem; line-height: 1.2; letter-spacing: -0.01em; }
  .desc { color: var(--muted); font-size: 0.93rem; margin-top: 2px; }
  .count { flex: none; font-size: 0.85rem; font-weight: 700; color: var(--accent); background: var(--accent-soft); border-radius: 999px; padding: 2px 12px; }
  .host { color: var(--muted); font-size: 0.82rem; }

  .section-head { display: flex; align-items: center; gap: 12px; padding: 14px 18px; background: var(--panel); border-top: 1px solid var(--line); }
  .section-head h2 { margin: 0; font-size: 1.05rem; font-weight: 700; line-height: 1.25; }
  .section-head p { margin: 2px 0 0; color: var(--muted); font-size: 0.9rem; }
  button.section-head { width: 100%; align-items: center; font: inherit; color: inherit; text-align: left; border: 0; border-top: 1px solid var(--line); cursor: pointer; }
  button.section-head:hover { background: var(--accent-soft); }
  .section-head .grow { flex: 1; min-width: 0; display: block; }
  .section-head .mini { flex: none; font-size: 0.8rem; font-weight: 700; color: var(--accent); }
  .chev { flex: none; width: 20px; height: 20px; color: var(--muted); }
  button.section-head[aria-expanded="true"] .chev { transform: rotate(180deg); }
  .inside[hidden] { display: none; }

  .inside { list-style: none; margin: 0; padding: 0; }
  .inside li { border-top: 1px solid var(--line); }
  .inside { background: var(--bg); }
  .slot { display: grid; grid-template-columns: 34px 1fr auto; align-items: center; gap: 12px; padding: 12px 18px; text-decoration: none; background: var(--panel); }
  .slot:hover { background: var(--accent-soft); }
  .rank { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: 0.9rem; border: 2px solid var(--accent); color: var(--accent); }
  .rank.plain { border-color: var(--line); color: var(--muted); }
  .slot .t { font-weight: 700; line-height: 1.25; }
  .slot:hover .t { text-decoration: underline; }
  .slot .d { display: block; color: var(--muted); font-size: 0.9rem; }
  .when { font-size: 0.85rem; font-weight: 500; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 999px; padding: 3px 12px; white-space: nowrap; }

  .empty { text-align: center; color: var(--muted); padding: 40px 12px; border: 2px dashed var(--line); border-radius: 14px; }

  footer { margin-top: 36px; color: var(--muted); font-size: 0.9rem; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 10px; }
  .theme { font: inherit; color: var(--muted); background: none; border: 1px solid var(--line); border-radius: 8px; padding: 4px 12px; cursor: pointer; }

  @media (max-width: 560px) {
    .slot { grid-template-columns: 34px 1fr; }
    .when { grid-column: 2; justify-self: start; white-space: normal; }
    .count { display: none; }
  }
  @media (prefers-reduced-motion: no-preference) {
    .chip, .slot, button.section-head { transition: background-color 0.12s, border-color 0.12s; }
    .chev { transition: transform 0.15s; }
  }
</style>
</head>
<body>
<div class="shell">
  <header>
    <div>
      <h1>Reviewers Tool Box</h1>
      <p class="sub">Every outside tool and link the team uses for tax prep and review, in one place.</p>
    </div>
    <div class="search">
      <input id="q" type="search" placeholder="Search tools" aria-label="Search tools" autocomplete="off">
      <kbd aria-hidden="true">/</kbd>
    </div>
  </header>

  <nav class="filters" id="filters" aria-label="Filter by category"></nav>
  <main id="out"></main>

  <footer>
    <span id="count"></span>
    <button class="theme" id="theme" type="button">Switch theme</button>
  </footer>
</div>

<script>
/* ------------------------------------------------------------------
   TO ADD A TOOL: copy one line inside a section's  links  list.
     title:    the tool's name
     url:      the link
     when:     short note on when to use it (optional)
     desc:     one line about what it is (optional)
     priority: number, 1 is used first (optional)

   TO ADD A SECTION: copy a whole block that starts with  title: "..."
   Everything sits inside the one big card.
------------------------------------------------------------------- */
const SECTIONS = [
  {
    title: "California Tax (FTB)",
    desc: "California income tax rates, tables and calculator.",
    links: [
      { title: "FTB Tax Calculator, Tables and Rates", desc: "California personal income tax calculator, tax tables and rates.", url: "https://www.ftb.ca.gov/file/personal/tax-calculator-tables-rates.asp" }
    ]
  },
  {
    title: "Vehicles & DMV",
    desc: "Vehicle registration and license fee lookups.",
    links: [
      { title: "California DMV Vehicle License Fee Calculator", desc: "Estimate the VLF and registration fees for a California vehicle.", url: "https://www.dmv.ca.gov/wasapp/FeeCalculatorWeb/vlfForm.do?csrt=14926755158816426428" }
    ]
  },
  {
    title: "Forms & Decoders",
    desc: "Help reading tax forms and their codes.",
    links: [
      { title: "Form 1095 Decoder", desc: "Decode the codes on Form 1095-A, B and C.", url: "https://www.mytaxform.com/form-1095-decoder/" }
    ]
  },
  {
    title: "Currency",
    desc: "Official exchange rates for foreign income and expenses.",
    links: [
      { title: "Treasury Currency Exchange Rates Converter", desc: "Official Treasury exchange rates for foreign currency amounts.", url: "https://fiscaldata.treasury.gov/currency-exchange-rates-converter/" }
    ]
  },
  {
    title: "Tax Research",
    desc: "California returns and Schedule C businesses, in the order we reach for them.",
    links: [
      { priority: 1,  title: "FTB Forms & Publications",    when: "Every CA return",     url: "https://www.ftb.ca.gov/Forms/" },
      { priority: 2,  title: "FTB Personal Filing",         when: "1040 review",         url: "https://www.ftb.ca.gov/file/personal/" },
      { priority: 3,  title: "FTB Personal Credits",        when: "Find missed credits", url: "https://www.ftb.ca.gov/file/personal/credits/index.html" },
      { priority: 4,  title: "Schedule CA Instructions",    when: "CA adjustments",      url: "https://www.ftb.ca.gov/forms/2025/2025-540-ca-instructions.html" },
      { priority: 5,  title: "IRS Schedule C Instructions", when: "Schedule C",          url: "https://www.irs.gov/instructions/i1040sc" },
      { priority: 6,  title: "IRS Publication 334",         when: "Business deductions", url: "https://www.irs.gov/publications/p334" },
      { priority: 7,  title: "IRS Publication 463",         when: "Vehicle / travel",    url: "https://www.irs.gov/publications/p463" },
      { priority: 8,  title: "IRS Publication 587",         when: "Home office",         url: "https://www.irs.gov/publications/p587" },
      { priority: 9,  title: "IRS Publication 946",         when: "Depreciation",        url: "https://www.irs.gov/publications/p946" },
      { priority: 10, title: "FTB PTET",                    when: "S-corp / 1065",       url: "https://www.ftb.ca.gov/file/business/credits/pass-through-entity-elective-tax/" }
    ]
  }
];

const $ = (id) => document.getElementById(id);
let activeCat = "All";
const collapsed = new Set(); // indexes of sections the user closed

function hostOf(url) { try { return new URL(url).hostname.replace(/^www\./, ""); } catch (e) { return url; } }
function esc(s) { return String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
function linkText(l, sec) { return (l.title + " " + (l.when || "") + " " + (l.desc || "") + " " + sec.title + " " + hostOf(l.url)).toLowerCase(); }

function renderFilters() {
  const total = SECTIONS.reduce((n, s) => n + s.links.length, 0);
  const cats = [["All", total], ...SECTIONS.map((s) => [s.title, s.links.length])];
  $("filters").innerHTML = cats.map(([c, n]) =>
    `<button class="chip" type="button" data-cat="${esc(c)}" aria-pressed="${c === activeCat}">${esc(c)}<span class="n">${n}</span></button>`
  ).join("");
}

function render() {
  const q = $("q").value.trim().toLowerCase();
  const total = SECTIONS.reduce((n, s) => n + s.links.length, 0);
  let shown = 0;

  const blocks = SECTIONS.map((sec, i) => {
    if (activeCat !== "All" && sec.title !== activeCat) return "";
    const links = sec.links
      .filter((l) => !q || linkText(l, sec).includes(q))
      .sort((a, b) => (a.priority || 999) - (b.priority || 999));
    if (!links.length) return "";
    shown += links.length;
    const foldable = sec.links.length > 1;            // sections with 2+ tools can collapse
    const open = !foldable || !!q || !collapsed.has(i); // searching always opens them
    const head = foldable
      ? `<button class="section-head" type="button" data-sec="${i}" aria-expanded="${open}" aria-controls="sec-${i}">
           <span class="grow"><h2>${esc(sec.title)}</h2>${sec.desc ? `<p>${esc(sec.desc)}</p>` : ""}</span>
           <span class="mini">${links.length} tools</span>
           <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
         </button>`
      : `<div class="section-head"><span class="grow"><h2>${esc(sec.title)}</h2>${sec.desc ? `<p>${esc(sec.desc)}</p>` : ""}</span></div>`;
    return `
      ${head}
      <ul class="inside" id="sec-${i}" ${open ? "" : "hidden"}>
        ${links.map((l) => `
          <li>
            <a class="slot" href="${esc(l.url)}" target="_blank" rel="noopener noreferrer">
              <span class="rank ${l.priority ? "" : "plain"}" ${l.priority ? `aria-label="Priority ${l.priority}"` : 'aria-hidden="true"'}>${l.priority ? esc(l.priority) : "&#8599;"}</span>
              <span>
                <span class="t">${esc(l.title)}</span>
                ${l.desc ? `<span class="d">${esc(l.desc)}</span>` : ""}
                <span class="host">${esc(hostOf(l.url))}</span>
              </span>
              ${l.when ? `<span class="when">${esc(l.when)}</span>` : ""}
            </a>
          </li>`).join("")}
      </ul>`;
  }).join("");

  $("out").innerHTML = shown
    ? `<section class="card" aria-label="All tools">
         <div class="card-head">
           <div class="mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8h18v12H3z"/><path d="M9 8V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v3"/><path d="M3 13h18"/></svg></div>
           <div class="grow">
             <div class="title">All tools</div>
             <div class="desc">Click any row to open it in a new tab.</div>
           </div>
           <span class="count">${shown} ${shown === 1 ? "tool" : "tools"}</span>
         </div>
         ${blocks}
       </section>`
    : `<div class="empty">No tools match "${esc($("q").value)}". Try a shorter word or pick All.</div>`;

  $("count").textContent = `${shown} of ${total} tools shown`;
}

$("filters").addEventListener("click", (e) => {
  const b = e.target.closest(".chip");
  if (!b) return;
  activeCat = b.dataset.cat;
  renderFilters();
  render();
});
$("out").addEventListener("click", (e) => {
  const h = e.target.closest("button.section-head");
  if (!h) return;
  const i = Number(h.dataset.sec);
  const open = h.getAttribute("aria-expanded") === "true";
  if (open) collapsed.add(i); else collapsed.delete(i);
  h.setAttribute("aria-expanded", String(!open));
  document.getElementById("sec-" + i).hidden = open;
});
$("q").addEventListener("input", render);
document.addEventListener("keydown", (e) => {
  if (e.key === "/" && document.activeElement !== $("q")) { e.preventDefault(); $("q").focus(); }
  if (e.key === "Escape" && document.activeElement === $("q")) { $("q").value = ""; render(); $("q").blur(); }
});

$("theme").addEventListener("click", () => {
  const root = document.documentElement;
  const dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  root.dataset.theme = dark ? "light" : "dark";
  try { localStorage.setItem("rtb-theme", root.dataset.theme); } catch (e) {}
});
try { const t = localStorage.getItem("rtb-theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}

renderFilters();
render();
</script>
</body>
</html>
